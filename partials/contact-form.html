<form class="form" id="contact-form" novalidate>
                    <p class="sr-only"><label>Leave this empty: <input name="company" tabindex="-1" autocomplete="off"></label></p>
          <div class="form__row">
            <label>Name<input name="name" autocomplete="name" required maxlength="100" placeholder="Your full name"></label>
            <label>Email<input name="email" type="email" autocomplete="email" required maxlength="200" placeholder="you@company.com"></label>
          </div>
          <label>I'm interested in<select name="topic">
            <option>Operations &amp; maintenance</option>
            <option>Training</option>
            <option>Partnership</option>
            <option>General question</option>
          </select></label>
          <label>Message<textarea name="message" required maxlength="3000" rows="5" placeholder="A few lines about what you need"></textarea></label>
          <button class="btn btn--primary btn--block" type="submit">Send message</button>
          <p class="form__status" role="status"></p>
        </form>
