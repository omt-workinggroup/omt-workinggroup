<form class="reg" id="register-form" data-source="community" novalidate>
            <p class="sr-only"><label>Leave this empty: <input name="company" tabindex="-1" autocomplete="off"></label></p>
            <input type="hidden" name="role" value="Student">
            <div class="reg__row">
              <label class="reg__field"><span class="reg__label">Full name</span><input name="name" autocomplete="name" required maxlength="200" placeholder="Your full name"></label>
              <label class="reg__field"><span class="reg__label">Email</span><input name="email" type="email" autocomplete="email" required maxlength="200" placeholder="you@school.ac.uk"></label>
            </div>
            <div class="reg__row">
              <label class="reg__field"><span class="reg__label">School, college or university</span><input name="organisation" autocomplete="organization" required maxlength="200" placeholder="e.g. Hillside Academy"></label>
              <label class="reg__field"><span class="reg__label">Town or city <small>optional</small></span><input name="location" autocomplete="address-level2" maxlength="200" placeholder="e.g. Manchester"></label>
            </div>
            <fieldset class="reg__group"><legend>I'm studying at</legend><div class="reg-chips"><label class="reg-chip"><input type="radio" name="level" value="GCSE (Years 10–11)" required><span>GCSE (Years 10–11)</span></label><label class="reg-chip"><input type="radio" name="level" value="A level, BTEC or T Level (Years 12–13)" required><span>A level, BTEC or T Level (Years 12–13)</span></label><label class="reg-chip"><input type="radio" name="level" value="University" required><span>University</span></label><label class="reg-chip"><input type="radio" name="level" value="Apprenticeship" required><span>Apprenticeship</span></label><label class="reg-chip"><input type="radio" name="level" value="Other" required><span>Other</span></label></div></fieldset>
            <fieldset class="reg__group"><legend>Subjects I'm into <small>choose any</small></legend><div class="reg-chips"><label class="reg-chip"><input type="checkbox" name="interests" value="Computer Science"><span>Computer Science</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="IT and digital skills"><span>IT and digital skills</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Networking"><span>Networking</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Cybersecurity"><span>Cybersecurity</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Engineering"><span>Engineering</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Data and AI"><span>Data and AI</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Maths"><span>Maths</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Business"><span>Business</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Study skills"><span>Study skills</span></label><label class="reg-chip"><input type="checkbox" name="interests" value="Microsoft Office skills"><span>Microsoft Office skills</span></label></div></fieldset>
            <label class="reg__consent"><input type="checkbox" name="over13" required><span>I'm 13 or older.</span></label>
            <label class="reg__consent"><input type="checkbox" name="consent" required><span>I agree that OMT Working Group may email me about the student community. See our <a href="privacy.html">Privacy Policy</a>.</span></label>
            <button class="btn btn--primary btn--block" type="submit">Join the student community</button>
            <p class="reg__status" role="status"></p>
          </form>
