  <meta name="twitter:image" content="https://omt-working-group.vercel.app/assets/og-image.png">

<body data-page="assistant" class="ai-app">
  <a class="skip-link" href="#chat-input">Skip to the message box</a>
  <div class="ai is-empty" id="ai-app">
    <header class="ai__bar">
      <a class="ai__back" href="home.html" aria-label="Back to the library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <div class="ai__id">
        <img src="assets/logo-mark.svg" alt="" width="36" height="28">
        <div><h1 class="ai__title">OMT AI</h1><span class="ai__mode" id="ai-mode">Checking…</span></div>
      </div>
      <nav class="ai__actions" aria-label="Chat">
        <a class="ai__link" href="library.html">Library</a>
        <button type="button" class="ai__new" id="clear-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>New chat</span></button>
      </nav>
    </header>
    <div class="ai__context" id="context-slot"></div>
    <main class="ai__log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></main>
    <div class="ai__dock">
      <div class="ai__suggest"><p class="sr-only">Suggested questions</p><ul class="chips" id="suggestions"></ul></div>
      <form class="ai__composer" id="chat-form">
        <label class="sr-only" for="chat-input">Message OMT AI</label>
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Message OMT AI…" required enterkeyhint="send" autocomplete="off"></textarea>
        <button class="ai__send" type="submit" id="send-btn"><span class="sr-only">Send</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </form>
      <p class="ai__hint">OMT AI can get things wrong. Check anything important with the source it links.</p>
    </div>
  </div>
  <noscript><p class="container">OMT AI needs JavaScript. You can still <a href="library.html">browse the library</a>.</p></noscript>
</body>
</html>
